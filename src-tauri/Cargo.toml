[package]
name = "galvani"
version = "0.1.0"
description = "Desktop app that revives the Thalmic Labs Myo armband over Bluetooth Low Energy"
authors = ["mdiazn80"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "galvani_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.8.0"
log = "0.4"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
thiserror = "2.0.21"
uuid = "1.29.0"
async-trait = "0.1.92"
btleplug = "0.13.5"
futures-util = "0.3.34"
rustfft = "6.4.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2.5.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
